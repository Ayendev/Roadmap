<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_dropdown.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">
  <title>Custom dropdown</title>
</head>
<body>
      <main>
          <h1>Custom Dropdown</h1>
          <div class="wrapper_dropdown_">
              <span>
                  <input type="button" class="dropdown_" value="Select an Item">
                  <i class="icon icon-arrow-down"></i>
              </span>
              <ul id="myList" class="listdropdown_" tabindex="0">
                  <li><button class="item_button_" type="button" value="First Item">First Item</button><i></i></li>
                  <li><button class="item_button_" type="button" value="Second Item">Second Item</button><i></i></li>
                  <li><button class="item_button_" type="button" value="Third Item">Third Item</button><i></i></li>
                  <li><button class="item_button_" type="button" value="Fourth Item">Fourth Item</button><i></i></li>
                  <li><button class="item_button_" type="button" value="Five Item">Five Item</button><i></i></li>
              </ul>
          </div>
      </main>

    <!--<script src="dynamicDropdown.js"></script>-->
    <script src="dynamicDropdown.js"></script>
</body>
</html>
