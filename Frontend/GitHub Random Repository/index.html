<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Style.css">
    <title>GitHub Random Repository</title>
</head>
<body>
  <main>
      <div class="head">
          <span><i class="icon icon-github"></i></span>
          <p>GitHub Random Repository</p>
      </div>

      <select id="options_lang">
          <option>Select a language</option>
      </select>

      <h6 id="message" class=""></h6>

      <div id="placeResult" class="hide">
          <h3 class="title"></h3>
          <p class="description"></p>
          <p class="details">
              <a class="detail-lang" aria-hidden></a>
              <a class="detail-star" aria-hidden></a>
              <a class="detail-fork" aria-hidden></a>
              <a class="detail-info" aria-hidden></a>
          </p>
      </div>
      <button id="btn_var" class="hide"></button>
  </main>
<script type="module" src="index.js"></script>

</body>
</html>
