<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="converter_container">
        <div class="">
            <h3 class="title">Temperature Converter</h3>
            <p class="help">Enter the temperature, select units and submit.</p>
        </div>
        <form class="form_converter">
            <div class="input_group">
                <input id="number" type="text" placeholder="0.00" value="" required>
            </div>
            <div class="input_group">
                <select id="from_unit" required>
                    <option value="" selected>From Unit</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Celcius">Celsius</option>
                    <option value="Kelvin">Kelvin</option>
                </select>
            </div>
            <div class="input_group">
                <select  id="to_unit" required>
                    <option value="" selected>To Unit</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Celcius">Celsius</option>
                    <option value="Kelvin">Kelvin</option>
                </select>
            </div>
            <div class="action">
                <button type="submit" id="convert">Convert</button>
            </div>
        </form>
        <p id="display_converter"></p>
    </main>

<script src="converter.js"></script>
</body>
</html>
